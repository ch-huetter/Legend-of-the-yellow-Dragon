dashboard.introduction.greeting=Ich heiße euch willkommen. Ihr seid nun bereit eine magische Welt zu betreten voller Magie, Abenteuern und Fabelwesen. Doch für euer Abenteuer fehlt euch noch etwas!\n\n\
                                Manifestiert die Gestalt eines Helden mit der ihr diese Welt durchstreifen und entdecken könnt. Doch seit gewarnt! Viele gefährliche Prüfungen und schwierige Kämpfe erwarten euch\
                                doch euer Weg soll nicht umsonst sein! Für all die Not die ihr leidet werdet ihr stets belohnt werden. Ob mit Schätzen, Ressourcen, Freundschaft oder einfach nur einer guten Geschichte!\n\n\
                                Also worauf wartet ihr noch eilt zum Altar der Seelen!