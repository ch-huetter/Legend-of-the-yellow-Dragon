message.noCharacterAvailable=So wie es aussieht, hast du noch keinen Charakter. Folge dem Weg zum Tempel der Ewigkeit und führe das uralte Ritual der Beschwörung durch\
   gib deinem Charakter Form und entscheide wie du die kommenden Schlachten schlagen möchtest. Als brutaler Krieger der mit massivem Lebenspool seine Gegner niedermacht, Magier der mächtige Zauber einsetzt oder doch ein Bogenschütze der Geschickt die Verteidigung seines Gegners umgeht. \
  <a href="/character/showCreate">Entscheide dich jetzt!</a>.
