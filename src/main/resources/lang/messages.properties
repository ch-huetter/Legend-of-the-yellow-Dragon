abilityTree.warrior.name=Krieger
abilityTree.warrior.description=Krieger sind zähe Kämpfer. Ihre rohe Stärke und hohe Vitalität machen sie zu schwer bezwingbaren Gegner. Sie stehen noch lange nachdem andere schon längst zu boden gegangen sind. Durch ihre monströse Stärke können sie oft auch gepanzerte Feinde besiegen. Man sagt ihnen aber nach sehr träge zu sein.