message.noCharacterAvailable=So wie es aussieht, hast du noch keinen Charakter. Folge dem Weg zum Tempel der Ewigkeit und führe das uralte Ritual der Beschwörung durch\
   gib deinem Charakter Form und entscheide wie du die kommenden Schlachten schlagen möchtest. Als brutaler Krieger der mit massivem Lebenspool seine Gegner niedermacht, Magier der mächtige Zauber einsetzt oder doch ein Bogenschütze der Geschickt die Verteidigung seines Gegners umgeht. \
  <a href="/character/showCreate">Entscheide dich jetzt!</a>.
playerClass.warrior.name=Krieger
playerClass.warrior.description=<span>Krieger sind zähe Kämpfer. Ihre rohe Stärke und hohe Vitalität machen sie schwer bezwingbaren Gegner. \
  Sie stehen noch lange nachdem andere schon längst zu boden gegangen sind. Durch ihre monströse Stärke können sie oft auch gepanzerte Feinde in die Knie bezwingen. Mit der Ausdauer haben sie es meistens aber nicht so.</span>\
  <br> <span class="leg-effekt-positive"> Erhält zusätzlich 30% Lebenspunkte </span>\
  <br> <span class="leg-effekt-negative"> Angriffe verbrauchen zusätzlich 10% mehr Ausdauer </span>
playerClass.mage.name=Zauberer
playerClass.mage.description=<span> Magier sind sehr Intelligente Kämpfer. Sie sind äusserst Trickreich und können mit mächtigen Zaubern das Geschick des Kampfes für sich entscheiden</span>\
  <br> <span class="leg-effekt-positive"> Erhält die Ressource Mana und Zaubersprüche die sie im Kampf einsetzen können </span>\
  <br> <span class="leg-effekt-negative"> Normale Angriffe machen 33% weniger Schaden </span>
playerClass.duelist.name=Duellist
playerClass.duelist.description=<span> Duellisten sind für ihre übernatürliche Agilität bekannt. Sie können ihre Gegner geschickt ausmanövrieren und gezielt Schwachstellen angreifen. Ihre Taktik besteht eher daraus n</span>\
  <br> <span class="leg-effekt-positive"> Erhält einen Bonus von 10% - 30% auf Rüstungsdurchdringung in Abhängigkeit vom Charakter Level </span>\
  <br> <span class="leg-effekt-negative"> Schadenreduktion von Rüstung ist um 20% geringer </span>
playerClass.monk.name=Mönch
playerClass.monk.description=<span> Mönche sind ausgeglichene Kämpfer. Sie vernachlässigen weder Körper noch Geist und sind so im stetigen Einklang mit sich selbst und der Welt um sich herum </span>\
  <br> <span class="leg-effekt-positive"> Beim Levelaufstieg werden alle Attribute erhöht </span>\
  <br> <span class="leg-effekt-negative"> Bekommt keine Attributspunkte die er verteilen kann </span>
