<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<th:block th:fragment="content">
    <label th:unless="${hideLabel}" th:text="${text}" th:for="${field}" style="padding-right:1.5px;"
           class="leg-rounded-border-label"></label>
    <input th:id="${id}" th:type="${type}" th:field="*{__${field}__}" th:disabled="${disabled}"
           class="leg-rounded-border-input">

</th:block>
</html>
