<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<div th:fragment="contentWrapper(object,field, content)"
     th:with="type=${type} ?: 'text', disabled=${disabled}, required=${required}"
     class="leg-rounded-border leg-rounded-container-outer leg-gradient p-1 mx-2">
    <div class="leg-rounded-container-inner">
        <th:block th:replace="${content}"/>
    </div>
</div>
</html>
