<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<th:block th:replace="~{fragments/head::head('Registration',~{::custom})}"/>
<body class="main-wrapper-fullscreen background-image" hx-boost="true"
      th:style="'background:url(' + @{/images/background/register_background.png} + ');'">
<div class="content-wrapper leg-flex-container">
    <div class="leg-flex-row mb-3">
        <h1 th:text="#{registration.greeting}">Willkommen</h1>
    </div>
    <div class="leg-flex-container" style="margin: auto;">
        <div class="leg-flex-row mb-3">
            <div class="leg-rounded-border leg-rounded-container-outer leg-gradient" style="height:auto">
                <p class="leg-rounded-center-text leg-rounded-container-inner"
                   th:text="#{registration.greetingText}"></p>
            </div>
        </div>
        <form th:action="@{/registration/createUser}" th:object="${registrationDto}" method="post"
              th:style="'width:100%;'">
            <input type="hidden" th:value="*{user.gender}" id="selectedGender">
            <!-- Gender Unused. Was initially planned for more personal messages. But was scrapped due to complexity. Will maybe return
            <div class="leg-flex-row mb-3" id="genderSelection">
                <div th:each="gender : *{genderList}" th:value="${gender}"
                     class="leg-rounded-border leg-flex-container leg-w33 leg-button-wrapper leg-transition leg-rounded-container-outer mx-3">
                    <div class="leg-rounded-container-inner">
                        <p th:text="#{${gender.name}}" class="leg-center-text-100"></p>
                    </div>
                </div>
            </div>
            -->
            <div class="leg-flex-row mb-3">
                <div th:replace="~{fragments/form/formWrapper::contentWrapper(object='registrationDto',field='user.loginName',content=~{fragments/form/textboxInput::content})}">
                </div>
                <div th:replace="~{fragments/form/formWrapper::contentWrapper(object='registrationDto',field='user.password',content=~{fragments/form/textboxInput::content},type='password')}">
                </div>
            </div>
            <div class="leg-flex-row mb-3">
                <div th:replace="~{fragments/form/formWrapper::contentWrapper(object='registrationDto',field='user.eMail',content=~{fragments/form/textboxInput::content},type='email')}">
                </div>
            </div>
            <div class="leg-flex-row mb-3" th:style="'justify-content:center;'">
                <th:block th:replace="~{fragments/form/href(href=@{/login}, text=#{button.backToLogin})}"/>
                <div class="leg-rounded-border leg-button-wrapper leg-transition leg-rounded-container-outer col-3 p-1 mx-2">
                    <input type="submit" th:value="#{button.submit}" class=""/>
                </div>
            </div>
        </form>
    </div>
</div>
</body>
<th:block th:fragment="custom">
    <script th:src="@{/js/registration.js}" defer></script>
</th:block>
</html>
